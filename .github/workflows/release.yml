name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false

      - name: Verify version matches tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Release tag and manifest version differ" }

      - name: Install development tools
        run: npm ci

      - name: Require a maintainer-authored release or draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = 'Stop'
          $author = gh release view $env:RELEASE_TAG --json author --jq '.author.login'
          if ($LASTEXITCODE -ne 0) { throw 'Create a draft release as the repository owner before running Release.' }
          if ($author -ne $env:RELEASE_OWNER) { throw 'Release author must be the repository owner.' }

      - name: Run tests
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:release

      - name: Build browser archives
        id: build
        shell: pwsh
        run: |
          $chromePath = & ./scripts/build-release.ps1
          $firefoxPath = & ./scripts/build-release.ps1 -Browser firefox
          if (-not $chromePath -or -not $firefoxPath) {
            throw "build-release.ps1 did not return both archive paths"
          }
          "chrome_path=$chromePath" >> $env:GITHUB_OUTPUT
          "firefox_path=$firefoxPath" >> $env:GITHUB_OUTPUT

      - name: Validate Firefox package
        run: npm run lint:firefox

      - name: Download and verify the signed Firefox XPI from AMO
        id: signed
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          FIREFOX_ARCHIVE: ${{ steps.build.outputs.firefox_path }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $xpiPath = & ./scripts/get-signed-firefox.ps1 -Version $version -UnsignedArchivePath $env:FIREFOX_ARCHIVE
          "xpi_path=$xpiPath" >> $env:GITHUB_OUTPUT

      - name: Build release notes
        id: notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $notesPath = Join-Path $env:RUNNER_TEMP ("Free-Games-Watcher-{0}-release-notes.md" -f $version)
          & ./scripts/get-release-notes.ps1 -Version $version -OutputPath $notesPath
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Update the maintainer's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $tag = $env:RELEASE_TAG
          $chromePath = "${{ steps.build.outputs.chrome_path }}"
          $firefoxPath = "${{ steps.signed.outputs.xpi_path }}"
          $notesPath = "${{ steps.notes.outputs.notes_path }}"

          $PSNativeCommandUseErrorActionPreference = $true
          gh release upload $tag $chromePath $firefoxPath --clobber
          $release = gh release view $tag --json assets,isDraft | ConvertFrom-Json
          foreach ($path in @($chromePath, $firefoxPath)) {
            $name = Split-Path -Leaf $path
            $asset = $release.assets | Where-Object { $_.name -ceq $name }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not $asset -or $asset.digest -cne "sha256:$hash") { throw "Uploaded asset hash differs: $name" }
          }
          # Remove the old unsigned download only after both replacements are verified.
          $oldName = "Free-Games-Watcher-Firefox-$($tag -replace '^v', '').zip"
          if ($release.assets.name -ccontains $oldName) { gh release delete-asset $tag $oldName --yes }
          if ($release.isDraft) {
            gh release edit $tag --title "Free Games Watcher $tag" --notes-file $notesPath
          } else {
            gh release edit $tag --title "Free Games Watcher $tag" --notes-file $notesPath --latest
          }
