name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false

      - name: Verify version matches tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Release tag and manifest version differ" }

      - name: Run tests
        run: npm test

      - name: Build release archive
        id: build
        shell: pwsh
        run: |
          $archivePath = & ./scripts/build-release.ps1
          if (-not $archivePath) {
            throw "build-release.ps1 did not return an archive path"
          }
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Build release notes
        id: notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $notesPath = Join-Path $env:RUNNER_TEMP ("Free-Games-Watcher-{0}-release-notes.md" -f $version)
          & ./scripts/get-release-notes.ps1 -Version $version -OutputPath $notesPath
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $tag = $env:RELEASE_TAG
          $archivePath = "${{ steps.build.outputs.archive_path }}"
          $notesPath = "${{ steps.notes.outputs.notes_path }}"

          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag *> $null
          $releaseViewExitCode = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true

          if ($releaseViewExitCode -eq 0) {
            gh release upload $tag $archivePath --clobber
            $isDraft = gh release view $tag --json isDraft --jq '.isDraft'
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect release draft state" }
            if ($isDraft -eq 'true') {
              # Preserve the human-created draft and its author; publish from the UI after validation.
              gh release edit $tag --title "Free Games Watcher $tag" --notes-file $notesPath
            } else {
              gh release edit $tag --title "Free Games Watcher $tag" --notes-file $notesPath --latest
            }
          } elseif ($releaseViewExitCode -eq 1) {
            gh release create $tag $archivePath --title "Free Games Watcher $tag" --notes-file $notesPath --latest --verify-tag
          } else {
            throw "gh release view failed with exit code $releaseViewExitCode"
          }
